<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101733"><meta name="description" content="CMA Part 1 study app — source-based e-book, questions, flashcards, practice and mocks"><title>CMA Part 1 Study Master</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#12182f;--muted:#66728c;--line:#e2e7f0;--nav:#101733;--nav2:#1d2857;--brand:#5b5fef;--cyan:#21bfd5;--good:#0b9a68;--bad:#d63d59;--warn:#b97813;--shadow:0 12px 34px rgba(20,30,70,.09);--r:18px}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--nav),var(--nav2));color:#fff;padding:12px 14px;box-shadow:0 8px 22px #10173322}.toprow{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;font-size:16px}.sub{font-size:10px;color:#bac4e4;margin-top:2px}.main{max-width:1050px;margin:auto;padding:15px 13px 92px}.hero{background:linear-gradient(135deg,#eef0ff,#eafcff);border:1px solid #dce3ff;border-radius:24px;padding:18px;box-shadow:var(--shadow)}h1{font-size:27px;line-height:1.08;margin:0;letter-spacing:-.6px}h2{font-size:19px;margin:0}.muted{color:var(--muted)}.section{margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.domain,.q,.flash{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:var(--shadow)}.domain{text-align:left;position:relative;overflow:hidden;min-height:145px}.domain:after{content:'';position:absolute;width:95px;height:95px;border-radius:50%;right:-24px;top:-24px;background:linear-gradient(135deg,#e8eaff,#e0fbff)}.domain>*{position:relative;z-index:1}.letter{font-size:28px;font-weight:950}.weight{font-size:11px;color:#4c51ca;font-weight:900;margin-top:4px}.dtitle{font-size:13px;font-weight:850;display:block;max-width:185px;margin-top:7px}.progress{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--cyan));width:0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 11px;border-radius:12px;font-weight:800}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.list{display:grid;gap:9px}.unitCard,.sectionCard{display:flex;gap:12px;align-items:center;text-align:left}.unitCard .badge{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--cyan));color:#fff;display:grid;place-items:center;font-weight:950}.card h3{margin:0;font-size:15px}.card p{margin:5px 0 0;font-size:11px;color:var(--muted)}.mind{background:linear-gradient(145deg,#0f1736,#202d62);color:#fff;border-radius:23px;padding:15px;min-height:310px;position:relative;overflow:hidden}.mindmap{position:relative;min-height:275px}.centerNode{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;background:#fff;color:#12182f;border-radius:17px;padding:12px 14px;font-weight:950;max-width:190px;text-align:center;box-shadow:0 9px 22px #0004}.mnode{position:absolute;background:#ffffff14;border:1px solid #ffffff35;color:#fff;border-radius:13px;padding:9px;font-size:11px;font-weight:800;max-width:135px;text-align:center;cursor:pointer}.mn0{left:1%;top:5%}.mn1{right:1%;top:5%}.mn2{left:0;bottom:7%}.mn3{right:0;bottom:7%}.mn4{left:35%;top:0}.detail{margin-top:10px;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:13px;line-height:1.55;font-size:13px}.page{background:#fff;border:1px solid var(--line);border-radius:21px;padding:18px;box-shadow:var(--shadow);font-family:Georgia,'Times New Roman',serif;font-size:16px;line-height:1.72}.page h3{font-family:Inter,system-ui,sans-serif;font-size:18px;margin:18px 0 8px}.page p{margin:0 0 11px}.page ul{padding-left:21px}.figureWrap{margin:14px 0;padding:10px;background:#fff;border:1px solid var(--line);border-radius:16px;text-align:center}.figureWrap img{display:block;max-width:100%;width:auto;height:auto;max-height:none;object-fit:contain;border-radius:10px;margin:0 auto}.figCaption{font-family:Inter,system-ui,sans-serif;font-size:10px;color:var(--muted);margin-top:7px}.tblwrap{overflow-x:auto;margin:14px 0}.tbl{width:100%;border-collapse:collapse;font-family:Inter,system-ui,sans-serif;font-size:12px;min-width:520px}.tbl th,.tbl td{border:1px solid #d7ddea;padding:8px;text-align:left;vertical-align:top}.tbl th{background:#eef1ff;font-weight:900}.tbl tr:nth-child(even) td{background:#fafbfe}.sourceTag{display:inline-block;background:#f0f2ff;color:#4d51ca;border:1px solid #dfe3ff;padding:5px 8px;border-radius:9px;font:800 10px Inter,system-ui,sans-serif}.flash{min-height:205px;display:flex;flex-direction:column;justify-content:center;text-align:center}.flash .front{font-size:20px;font-weight:900}.flash .back{margin-top:15px;padding-top:13px;border-top:1px dashed var(--line);font-size:14px;line-height:1.55}.qtext{font-size:16px;font-weight:850;line-height:1.5;margin:11px 0}.opt{display:flex;gap:9px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:11px;border-radius:13px;margin-top:8px}.opt.correct{background:#effbf6;border-color:#89d9ba}.opt.wrong{background:#fff0f4;border-color:#ffc1cb}.stat{font-size:24px;font-weight:950}.loading{text-align:center;padding:60px 15px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fffffff5;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;padding:7px 2px;font-size:10px;color:var(--muted);border-radius:11px}.bottom button.active{background:#eef0ff;color:#4c51ca;font-weight:900}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.main{padding:24px}.bottom{display:none}}
</style></head><body><div id="app"></div><script src="data/catalog.js"></script><script>
const C=window.CMA_CATALOG;let U=null,QS=null;const storeKey='CMA_PART1_FINAL_2026';let S=JSON.parse(localStorage.getItem(storeKey)||'null')||{view:'home',domain:null,unit:null,sec:null,map:0,flash:false,flashIdx:{},done:{},notes:{},written:{},bookmarks:{},answers:{},mock:null,practice:{unit:null,sec:null,idx:0},scroll:{}};function save(){localStorage.setItem(storeKey,JSON.stringify(S))}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function loadScript(path,cb){let old=document.querySelector('script[data-path="'+path+'"]');if(old){cb();return}let s=document.createElement('script');s.src=path;s.dataset.path=path;s.onload=cb;s.onerror=()=>{app.innerHTML='<div class="loading">Could not load '+esc(path)+'. Check that the GitHub Pages site contains the data folder.</div>'};document.body.appendChild(s)}function loadUnit(id,cb){if(U&&U.id===+id){cb();return}loadScript('data/unit'+id+'.js',()=>{U=window.CMA_UNIT;window.CMA_UNIT=null;cb()})}function loadQs(id,cb){if(QS&&QS.unit===+id){cb();return}loadScript('data/q'+id+'.js',()=>{QS={unit:+id,items:window.CMA_QS||[]};window.CMA_QS=null;cb()})}function top(t,sub=''){return '<div class="top"><div class="toprow"><div><div class="brand">'+esc(t||'CMA Part 1 Study Master')+'</div><div class="sub">'+esc(sub||'Phone-first CMA study system')+'</div></div><button class="btn" onclick="home()">⌂</button></div></div>'}function nav(a){return '<div class="bottom"><button class="'+(a==='home'?'active':'')+'" onclick="home()">⌂<br>Home</button><button class="'+(a==='study'?'active':'')+'" onclick="home()">📖<br>Study</button><button class="'+(a==='practice'?'active':'')+'" onclick="practiceHome()">✎<br>Practice</button><button class="'+(a==='progress'?'active':'')+'" onclick="progress()">◔<br>Progress</button></div>'}function home(){S.view='home';save();render()}function domainView(d){S.view='domain';S.domain=d;save();render()}function unitView(id){S.view='unit';S.unit=+id;S.sec=null;save();render()}function sectionView(uid,sid){S.view='section';S.unit=+uid;S.sec=sid;S.map=0;S.flash=false;save();loadUnit(uid,render)}function getSec(){return U?.sections?.find(x=>x.id===S.sec)}
function homeView(){return top('CMA Part 1 Study Master','A–F exam domains · source-based · phone-first')+'<main class="main"><section class="hero"><h1>Study the CMA.<br>Build the skill.</h1><p class="muted">Six exam domains first. Content loads only when you open a unit, keeping the web app fast on a phone.</p></section><section class="section"><div class="row"><h2>Part 1 Content Areas</h2><span class="muted">2026 blueprint</span></div><div class="grid" style="margin-top:10px">'+Object.entries(C.domains).map(([id,x])=>'<button class="domain" onclick="domainView(\''+id+'\')"><span class="letter">'+id+'</span><span class="weight">'+x.weight+'</span><span class="dtitle">'+esc(x.title)+'</span><div class="progress"><i style="width:'+domainPct(id)+'%"></i></div></button>').join('')+'</div></section><section class="section"><div class="card"><div class="row"><div><b>Question library</b><p>'+C.counts.questions.toLocaleString()+' structured questions · '+C.counts.originalQuestions.toLocaleString()+' original 2025-bank records + '+C.counts.supplementalQuestions.toLocaleString()+' supplemental records</p></div><button class="btn primary" onclick="practiceHome()">Practice →</button></div></div></section></main>'+nav('home')}
function domainPct(id){let us=C.domains[id].units,n=0,k=0;Object.keys(S.done).forEach(key=>{let uid=+String(key).split('.')[0];if(us.includes(uid)){n++;if(S.done[key])k++}});return n?Math.round(k/n*100):0}
function domainRender(){let d=C.domains[S.domain];return top(S.domain+' — '+d.title,d.weight+' of Part 1')+'<main class="main"><section class="hero"><div class="weight">DOMAIN '+S.domain+' · '+d.weight+'</div><h1 style="margin-top:6px">'+esc(d.title)+'</h1><p class="muted">Choose a study unit. Each unit opens into focused sections.</p></section><section class="section list">'+d.units.map(id=>{let u=C.units.find(x=>x.id===id);return '<button class="card unitCard" onclick="unitView('+id+')"><span class="badge">U'+id+'</span><span style="flex:1"><h3>Unit '+id+' · '+esc(u.title)+'</h3><p>'+u.sections+' sections · '+u.questions+' source/supplemental questions</p></span><b>›</b></button>'}).join('')+'</section></main>'+nav('study')}
function unitRender(){let u=U;return top('Unit '+u.id+' · '+u.title,S.domain+' · '+u.sections.length+' sections')+'<main class="main"><section class="hero"><span class="sourceTag">'+S.domain+' · UNIT '+u.id+'</span><h1 style="margin-top:7px">'+esc(u.title)+'</h1><p class="muted">Each section has a study heart, clean E-book, actual source figures/tables, flashcards, notes and practice.</p></section><section class="section list">'+u.sections.map(s=>'<div class="card sectionCard"><div style="flex:1"><h3>'+esc(s.title)+'</h3><p>'+s.questionCount+' questions mapped to this section · '+(S.done[s.id]?'✓ Completed':'Not completed')+'</p></div><button class="btn primary" onclick="sectionView('+u.id+',\''+s.id+'\')">Open</button></div>').join('')+'</section></main>'+nav('study')}
function mindMap(sec){let paras=sec.body.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);let nodes=[];for(let p of paras){let ls=p.split('\n').map(x=>x.trim()).filter(Boolean);let h=ls[0]||'';if(h.length<=80&&!/^●|^■|^Figure|^Example/i.test(h)&&!/^\d/.test(h)){let detail=ls.slice(1).join(' ')||p;if(h.length>4)nodes.push({h,detail})}}if(nodes.length<5){for(let p of paras){let t=p.replace(/\n/g,' ');if(t.length>45)nodes.push({h:t.slice(0,55)+'…',detail:t});if(nodes.length>=5)break}}nodes=nodes.slice(0,5);let chosen=Math.min(S.map,nodes.length-1);return '<div class="mind"><div class="mindmap"><div class="centerNode">'+esc(sec.title)+'</div>'+nodes.map((n,i)=>'<button class="mnode mn'+i+'" onclick="mapNode('+i+')">'+esc(n.h)+'</button>').join('')+'</div>'+(nodes[chosen]?'<div class="detail"><b>'+esc(nodes[chosen].h)+'</b><br>'+esc(nodes[chosen].detail.slice(0,850))+'</div>':'')+'</div>'}function mapNode(i){S.map=i;save();render()}
function tableHtml(t){if(!t)return '';let h=t.headers||[],rows=t.rows||[];let cols=Math.max(h.length,...rows.map(r=>r.length),1);function cells(a,tag){let x=a.slice();while(x.length<cols)x.push('');return x.map(v=>'<'+tag+'>'+esc(v)+'</'+tag+'>').join('')}return '<div class="tblwrap"><table class="tbl"><thead><tr>'+cells(h,'th')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cells(r,'td')+'</tr>').join('')+'</tbody></table></div>'}
function ebook(sec){let body=sec.body.replace(/\r/g,'');let lines=body.split('\n');let html='<div class="page">';let tables=C.tables||{};let skip=0;for(let i=0;i<lines.length;i++){if(skip){if(lines[i].trim()==='' && i+1<lines.length && lines[i+1].trim()===''){skip=0}continue}let raw=lines[i],t=raw.trim();if(!t)continue;let fm=t.match(/^Figure\s+(\d+-\d+)$/i);if(fm&&C.figures['Figure '+fm[1]]){let f=C.figures['Figure '+fm[1]];html+='<div class="figureWrap"><img loading="lazy" src="'+esc(f.file)+'" alt="Figure '+fm[1]+'"><div class="figCaption">Figure '+fm[1]+' · source page '+f.page+'</div></div>';continue}let em=t.match(/^Example\s+(\d+-\d+)(.*)$/i);if(em&&tables['Example '+em[1]]){html+='<h3>'+esc(t)+'</h3>';let j=i+1;while(j<lines.length&&lines[j].trim()==='')j++; // narrative remains before table
// table is injected after the example narrative paragraph(s); if immediate table-like lines follow, skip them
let seenBlank=false;for(let k=j;k<Math.min(lines.length,j+18);k++){let kk=lines[k].trim();if(!kk){seenBlank=true;continue}if(seenBlank && (/\$|\d|Number of|Input Cost|Total Cost|Days|Amount|Rate|Year|Balance|Units|Budget|Cost|Sales|Price|Variance/i.test(kk))){skip=1;break}}html+=tableHtml(tables['Example '+em[1]]);continue}if(/^●|^■|^–|^-\s/.test(t)){html+='<p>'+esc(t)+'</p>';continue}if(t.length<90&&!/[.!?:]$/.test(t)){html+='<h3>'+esc(t)+'</h3>'}else html+='<p>'+esc(t)+'</p>'}return html+'</div>'}
function sectionRender(){let sec=getSec();if(!sec)return '<div class="loading">Section not found.</div>';return top('Section '+sec.id+' · '+sec.title,S.domain+' · Unit '+U.id)+'<main class="main"><div class="row"><button class="btn" onclick="unitView('+U.id+')">← Unit '+U.id+'</button><div class="row"><button class="btn" onclick="bookmark()">'+(S.bookmarks[sec.id]?'★ Saved':'☆ Bookmark')+'</button><button class="btn" onclick="toggleDone()">'+(S.done[sec.id]?'✓ Completed':'Mark complete')+'</button></div></div><section class="section"><div class="hero"><span class="sourceTag">SECTION '+sec.id+'</span><h1 style="margin-top:7px">'+esc(sec.title)+'</h1><p class="muted">Study heart → complete source E-book → flashcards → practice.</p></div></section><section class="section"><div class="row"><h2>🧠 Study Heart</h2><span class="muted">5 key concepts</span></div>'+mindMap(sec)+'</section><section class="section"><div class="row"><h2>📖 E-book</h2><button class="btn" onclick="note()">📝 Note</button></div>'+ebook(sec)+'</section><section class="section"><div class="row"><h2>🗂 Flashcards</h2><button class="btn" onclick="flashNext()">Next</button></div>'+flashcard(sec)+'</section><section class="section"><div class="card"><div class="row"><div><h2>✍ Written Practice</h2><p>Write your own explanation, calculation steps, or exam-style response.</p></div><button class="btn" onclick="saveWritten()">Save</button></div><textarea id="writtenBox" style="width:100%;min-height:150px;margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical" placeholder="Write here…">'+esc(S.written[sec.id]||'')+'</textarea></div></section><section class="section"><div class="card"><div class="row"><div><h2>✎ Practice</h2><p>Questions mapped to '+esc(sec.id)+'.</p></div><button class="btn primary" onclick="practiceSection('+U.id+',\''+sec.id+'\')">Start</button></div></div></section></main>'+nav('study')}
function flashcard(sec){let lines=sec.body.split(/\n/).map(x=>x.trim()).filter(x=>x.length>35&&!/^Figure|^Example/i.test(x));let idx=S.flashIdx[sec.id]||0;let front=lines[idx%Math.max(lines.length,1)]||sec.title;let back=lines[(idx+1)%Math.max(lines.length,1)]||sec.body.slice(0,600);return '<div class="flash" onclick="flipFlash()"><div class="front">'+esc(front)+'</div>'+(S.flash?'':'<div class="muted" style="margin-top:11px">Tap to reveal</div>')+(S.flash?'<div class="back">'+esc(back)+'</div>':'')+'</div>'}function flipFlash(){S.flash=!S.flash;save();render()}function flashNext(){S.flashIdx[S.sec]=(S.flashIdx[S.sec]||0)+1;S.flash=false;save();render()}function toggleDone(){S.done[S.sec]=!S.done[S.sec];save();render()}function note(){let x=prompt('Notes for '+S.sec+':',S.notes[S.sec]||'');if(x!==null){S.notes[S.sec]=x;save();alert('Saved on this device.')}}function bookmark(){S.bookmarks[S.sec]=!S.bookmarks[S.sec];save();render()}function saveWritten(){let x=document.getElementById('writtenBox');if(x){S.written[S.sec]=x.value;save();alert('Written practice saved on this device.')}}
function practiceSection(uid,sid){S.view='practice';S.unit=+uid;S.sec=sid;S.practice={unit:+uid,sec:sid,idx:0};save();loadQs(uid,render)}function practiceHome(){S.view='practice';S.sec=null;S.practice={unit:null,sec:null,idx:0};save();render()}function answer(qid,l){let q=QS.items.find(x=>x.id===qid);S.answers[qid]={selected:l,correct:l===q.answer,at:Date.now(),unit:q.unit,subunit:q.subunit};save();render()}function practiceRender(){if(S.practice.sec&&QS){let arr=QS.items.filter(q=>q.unit===S.practice.unit&&q.subunit===S.practice.sec);if(!arr.length)return top('Practice','No mapped questions')+'<main class="main"><div class="card">No questions are mapped to this section.</div></main>'+nav('practice');let i=Math.min(S.practice.idx,arr.length-1),q=arr[i],a=S.answers[q.id];return top('Section Practice','Unit '+q.unit+' · '+q.subunit)+'<main class="main"><div class="hero"><div class="row"><b>Question '+(i+1)+' / '+arr.length+'</b><span>'+Math.round((i+1)/arr.length*100)+'%</span></div><div class="progress"><i style="width:'+Math.round((i+1)/arr.length*100)+'%"></i></div></div><section class="section"><div class="q"><div class="muted">'+esc(q.source||'2025 question bank')+'</div><div class="qtext">'+esc(q.question)+'</div>'+q.options.map((o,k)=>{let l=String.fromCharCode(65+k),cl='opt';if(a&&a.selected){if(l===q.answer)cl+=' correct';if(l===a.selected&&l!==q.answer)cl+=' wrong'}return '<button class="'+cl+'" onclick="answer(\''+esc(q.id)+'\',\''+l+'\')"><b>'+l+'</b><span>'+esc(o)+'</span></button>'}).join('')+(a?'<div class="detail"><b>'+(a.correct?'Correct':'Review')+'</b><br>'+esc(q.explanation||'')+'</div>':'')+'<div class="row" style="margin-top:12px"><button class="btn" onclick="practiceMove(-1)">← Previous</button><button class="btn primary" onclick="practiceMove(1)">Next →</button></div></div></section></main>'+nav('practice')}return top('Practice Center','Practice is separate from mock exams')+'<main class="main"><div class="hero"><h1>Practice Center</h1><p class="muted">Open a study section to practice its mapped questions. Full mock exams are separate.</p><button class="btn primary" style="margin-top:10px" onclick="mockHome()">Mock Exams →</button></div></main>'+nav('practice')}function practiceMove(n){S.practice.idx=Math.max(0,(S.practice.idx||0)+n);save();render()}
function progress(){S.view='progress';save();render()}function progressRender(){let vals=Object.values(S.answers),attempt=vals.length,correct=vals.filter(x=>x.correct).length;let unitStats={};vals.forEach(x=>{let k=x.unit+'.'+x.subunit;unitStats[k]=unitStats[k]||{n:0,c:0};unitStats[k].n++;if(x.correct)unitStats[k].c++});let weak=Object.entries(unitStats).sort((a,b)=>(a[1].c/a[1].n)-(b[1].c/b[1].n)).slice(0,5);return top('Progress','Resume + weakness engine')+'<main class="main"><section class="hero"><h1>Your Progress</h1><div class="grid" style="margin-top:12px"><div class="card"><div class="stat">'+attempt+'</div><p>Questions answered</p></div><div class="card"><div class="stat">'+Math.round(attempt?correct/attempt*100:0)+'%</div><p>Raw accuracy</p></div><div class="card"><div class="stat">'+Object.values(S.done).filter(Boolean).length+'</div><p>Sections completed</p></div></div><p class="muted" style="margin-top:12px">Practice metrics are not the official IMA 0–500 scaled score.</p></section><section class="section"><div class="card"><b>Weakest mapped areas</b>'+(weak.length?'<div class="list" style="margin-top:8px">'+weak.map(([k,v])=>'<div class="row"><span>'+esc(k)+'</span><b>'+Math.round(v.c/v.n*100)+'% · '+v.n+' attempted</b></div>').join('')+'</div>':'<p>No weakness data yet. Start section practice.</p>')+'</div></section><section class="section"><div class="card"><b>Resume</b><p>Last section: '+esc(S.sec||'None')+'</p>'+(S.sec?'<button class="btn primary" style="margin-top:9px" onclick="sectionView('+S.unit+',\''+S.sec+'\')">Resume →</button>':'')+'</div></section></main>'+nav('progress')}
// Mock engine: 10 full mocks, each exactly 100 MCQs with A15/B20/C20/D15/E15/F15; 3 sectional mocks per domain, 20 each.
let MOCKBANK=null;function loadAllQs(cb){if(MOCKBANK){cb();return}MOCKBANK=[];let i=1;function n(){if(i>20){cb();return}loadScript('data/q'+i+'.js',()=>{if(Array.isArray(window.CMA_QS))MOCKBANK.push(...window.CMA_QS);window.CMA_QS=null;i++;n()})}n()}function rng(seed){let x=(seed>>>0)||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}}function pick(a,n,seed){let x=a.slice(),r=rng(seed),o=[];while(x.length&&o.length<n)o.push(x.splice(Math.floor(r()*x.length),1)[0]);return o}function buildFull(n){let w={A:15,B:20,C:20,D:15,E:15,F:15},o=[];Object.entries(w).forEach(([d,c],j)=>{let units=C.domains[d].units,p=MOCKBANK.filter(q=>units.includes(+q.unit));o.push(...pick(p,c,n*100+j+1))});return o}function buildSec(d,n){let p=MOCKBANK.filter(q=>C.domains[d].units.includes(+q.unit));return pick(p,20,n*77+d.charCodeAt(0))}function mockHome(){S.view='mock';save();render()}function startMock(n){app.innerHTML='<div class="loading">Preparing Mock '+n+'…</div>';loadAllQs(()=>{S.view='mockrun';S.mock={kind:'full',number:n,items:buildFull(n),i:0,answers:{}};save();render()})}function startSecMock(d,n){app.innerHTML='<div class="loading">Preparing '+d+' sectional mock…</div>';loadAllQs(()=>{S.view='mockrun';S.mock={kind:'section',domain:d,number:n,items:buildSec(d,n),i:0,answers:{}};save();render()})}function mockAnswer(l){let m=S.mock,q=m.items[m.i];m.answers[q.id]=l;save();render()}function mockMove(n){S.mock.i=Math.max(0,Math.min(S.mock.items.length-1,S.mock.i+n));save();render()}function mockFinish(){let m=S.mock;Object.entries(m.answers).forEach(([id,l])=>{let q=m.items.find(x=>x.id===id);if(q)S.answers[id]={selected:l,correct:l===q.answer,at:Date.now(),unit:q.unit,subunit:q.subunit,mock:true}});S.mock.finished=true;save();render()}function mockRender(){let m=S.mock;if(!m)return mockList();let total=m.items.length,score=m.items.filter(q=>m.answers[q.id]===q.answer).length;if(m.finished)return top('Mock Result','Practice result · not official IMA scaled score')+'<main class="main"><section class="hero"><h1>'+(m.kind==='full'?'Full Mock '+m.number:m.domain+' Sectional Mock '+m.number)+'</h1><p class="muted">'+score+' / '+total+' correct · '+Math.round(score/total*100)+'% raw accuracy · '+Object.keys(m.answers).length+' answered</p><div class="row" style="margin-top:12px"><button class="btn" onclick="mockHome()">Mock Center</button><button class="btn primary" onclick="S.mock=null;save();render()">Done</button></div></section></main>'+nav('practice');let q=m.items[m.i],sel=m.answers[q.id],opts=q.options||[];return top(m.kind==='full'?'Full Mock '+m.number:m.domain+' Sectional Mock '+m.number,'CMA-style practice simulation')+'<main class="main"><div class="hero"><div class="row"><b>Question '+(m.i+1)+' / '+total+'</b><span>'+Object.keys(m.answers).length+' answered</span></div><div class="progress"><i style="width:'+Math.round(Object.keys(m.answers).length/total*100)+'%"></i></div></div><section class="section"><div class="q"><div class="muted">Unit '+q.unit+(q.subunit?' · '+q.subunit:'')+'</div><div class="qtext">'+esc(q.question)+'</div>'+opts.map((o,k)=>{let l=String.fromCharCode(65+k),cl='opt';if(sel&&l===q.answer)cl+=' correct';if(sel&&l===sel&&sel!==q.answer)cl+=' wrong';return '<button class="'+cl+'" onclick="mockAnswer(\''+l+'\')"><b>'+l+'</b><span>'+esc(o)+'</span></button>'}).join('')+(sel?'<div class="detail"><b>'+(sel===q.answer?'Correct':'Review')+'</b><br>'+esc(q.explanation||'')+'</div>':'')+'<div class="row" style="margin-top:12px"><button class="btn" onclick="mockMove(-1)">← Previous</button>'+(m.i<total-1?'<button class="btn primary" onclick="mockMove(1)">Next →</button>':'<button class="btn primary" onclick="mockFinish()">Finish</button>')+'</div></div></section></main>'+nav('practice')}function mockList(){return top('Mock Exams','Separate CMA-style simulations')+'<main class="main"><section class="hero"><h1>Mock Exam Center</h1><p class="muted">10 full mocks · exactly 100 MCQs each · A15/B20/C20/D15/E15/F15. Plus 3 sectional mocks per A–F.</p></section><section class="section grid">'+Array.from({length:10},(_,i)=>'<button class="card" onclick="startMock('+(i+1)+')"><b>Full Mock '+(i+1)+'</b><p>100 weighted MCQs</p></button>').join('')+'</section><section class="section"><h2>Sectional mocks</h2><div class="list" style="margin-top:9px">'+Object.entries(C.domains).map(([d,x])=>'<div class="card"><b>'+d+' · '+esc(x.title)+'</b><p>3 mocks · 20 MCQs each</p><div class="row" style="margin-top:8px">'+[1,2,3].map(n=>'<button class="btn" onclick="startSecMock(\''+d+'\','+n+')">Mock '+n+'</button>').join('')+'</div></div>').join('')+'</div></section></main>'+nav('practice')}
window.addEventListener('scroll',()=>{if(S.view==='section'&&S.sec){S.scroll[S.sec]=window.scrollY;try{localStorage.setItem(storeKey,JSON.stringify(S))}catch(e){}}},{passive:true});function restoreScroll(){if(S.view==='section'&&S.sec){setTimeout(()=>window.scrollTo(0,S.scroll[S.sec]||0),30)}}function render(){let app=document.getElementById('app');if(S.view==='home')app.innerHTML=homeView();else if(S.view==='domain')app.innerHTML=domainRender();else if(S.view==='unit'){if(!U||U.id!==+S.unit){app.innerHTML='<div class="loading">Loading Unit '+S.unit+'…</div>';loadUnit(S.unit,render);return}app.innerHTML=unitRender()}else if(S.view==='section'){if(!U||U.id!==+S.unit){app.innerHTML='<div class="loading">Loading section…</div>';loadUnit(S.unit,render);return}app.innerHTML=sectionRender()}else if(S.view==='practice'){if(S.practice.sec&&!QS){app.innerHTML='<div class="loading">Loading questions…</div>';loadQs(S.practice.unit,render);return}app.innerHTML=practiceRender()}else if(S.view==='mock')app.innerHTML=mockList();else if(S.view==='mockrun')app.innerHTML=mockRender();else if(S.view==='progress')app.innerHTML=progressRender();restoreScroll()}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
